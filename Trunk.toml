# Trunk configuration for html.rs web builds (wasm32).
#
# One HTML shell per example; each links its Rust bin via `data-bin`.
# Native + web share the same example source files.
#
#   trunk serve web/01_hello_world.html
#   trunk serve web/02_counter_app.html   (default below)
#   trunk serve web/03_todo_app.html

[build]
target = "web/02_counter_app.html"
dist = "dist"

[serve]
port = 8080
open = false
